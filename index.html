<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La mia libreria di Link</title>
    <!-- Tailwind CSS per il design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse per leggere il CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* CSS aggiuntivo per l'effetto anteprima che segue il mouse */
        #preview-box {
            position: fixed;
            pointer-events: none; /* Evita fastidiosi sfarfallii del mouse */
            z-index: 50;
            display: none;
            width: 300px;
            height: 225px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            transform: translate(15px, 15px); /* Sposta l'anteprima leggermente a destra in basso rispetto al cursore */
        }
        
        #preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        /* Effetto di caricamento (spinner) mentre carica lo screenshot */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -15px;
            margin-left: -15px;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-slate-700">La mia Collezione di Link</h1>

        <!-- Controlli: Cerca e Filtra -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 bg-white p-4 rounded-xl shadow-sm">
            <input type="text" id="searchInput" placeholder="Cerca un sito..." class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="sortSelect" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                <option value="random">Ordine Casuale (Default)</option>
                <option value="nameAsc">Nome (A-Z)</option>
                <option value="dateDesc">Più recenti (in fondo al foglio)</option>
                <option value="dateAsc">Meno recenti (in cima al foglio)</option>
            </select>
        </div>

        <!-- Lista dei link -->
        <ul id="linkList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <li class="col-span-full text-center py-10 text-slate-500">Caricamento link in corso...</li>
        </ul>
    </div>

    <!-- Div nascosto che mostrerà l'anteprima -->
    <div id="preview-box">
        <div class="loader" id="preview-loader"></div>
        <img id="preview-image" src="" alt="Anteprima">
    </div>

    <script>
        // =======================================================
        // INCOLLA QUI IL LINK CSV DEL TUO FOGLIO GOOGLE!
        // =======================================================
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTPQ_9hUR1qMz04BxjckK_RX2poudh93waYCFYsCBKnu6Q8QqWECpUxnxSwveS9JyTMuwq4qEy6Jzrj/pubhtml';
        
        let allLinks = [];

        // Funzione per estrarre il nome pulito dall'URL
        function estraiNomeDaURL(url) {
            try {
                let domain = new URL(url).hostname; // Prende solo il dominio (es. www.google.com)
                domain = domain.replace(/^www\./i, ''); // Rimuove "www." se c'è
                
                let parts = domain.split('.'); 
                
                // Se è qualcosa tipo "amazon.co.uk", prende "amazon"
                if (parts.length > 2 && (parts[parts.length - 2] === 'co' || parts[parts.length - 2] === 'gov')) {
                    domain = parts[parts.length - 3];
                } else {
                    // Altrimenti prende la parola prima dell'ultimo punto (es. "github" da "github.com")
                    domain = parts[parts.length - 2] || parts[0];
                }

                // Mette la prima lettera maiuscola e restituisce il nome
                return domain.charAt(0).toUpperCase() + domain.slice(1);
            } catch (e) {
                return "Sito Web"; // Se l'URL è scritto male, mostra questo
            }
        }

        // 1. Scarica e leggi il CSV
        Papa.parse(sheetUrl, {
            download: true,
            header: true,
            complete: function(results) {
                // Filtriamo le righe vuote e creiamo dinamicamente il "Nome" e la "Data" (basata sull'indice di riga)
                allLinks = results.data
                    .filter(row => row.URL && row.URL.trim() !== "") 
                    .map((row, index) => {
                        return {
                            URL: row.URL.trim(),
                            Nome: estraiNomeDaURL(row.URL.trim()),
                            Indice: index // Usiamo l'ordine della riga come "Data di aggiunta"
                        };
                    });
                
                allLinks = shuffleArray(allLinks);
                renderLinks(allLinks);
            }
        });

        // 2. Mostra i link nell'HTML
        function renderLinks(links) {
            const list = document.getElementById('linkList');
            list.innerHTML = ''; 

            if(links.length === 0) {
                list.innerHTML = '<li class="col-span-full text-center py-10 text-slate-500">Nessun link trovato.</li>';
                return;
            }

            links.forEach(link => {
                const li = document.createElement('li');
                li.className = "bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-slate-100 flex items-center justify-between";
                
                // Generiamo il link all'immagine tramite mshots di WordPress
                const encodedUrl = encodeURIComponent(link.URL);
                const screenshotUrl = `https://s0.wordpress.com/mshots/v1/${encodedUrl}?w=600`;

                li.innerHTML = `
                    <a href="${link.URL}" target="_blank" class="preview-trigger text-blue-600 font-semibold text-lg hover:underline truncate" data-img="${screenshotUrl}">
                        ${link.Nome}
                    </a>
                `;
                list.appendChild(li);
            });

            setupHoverEffects();
        }

        // 3. Mescola l'array in modo random
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 4. Logica di filtraggio e ordinamento
        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;

            let filtered = allLinks.filter(link => link.Nome.toLowerCase().includes(searchText));

            if (sortMode === 'nameAsc') {
                filtered.sort((a, b) => a.Nome.localeCompare(b.Nome));
            } else if (sortMode === 'dateDesc') {
                // Più recenti = Indice più alto (in fondo al foglio excel)
                filtered.sort((a, b) => b.Indice - a.Indice);
            } else if (sortMode === 'dateAsc') {
                // Meno recenti = Indice più basso (in cima al foglio excel)
                filtered.sort((a, b) => a.Indice - b.Indice);
            } else if (sortMode === 'random') {
                filtered = shuffleArray(filtered);
            }

            renderLinks(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);

        // 5. Gestione dell'Anteprima con il Mouse
        function setupHoverEffects() {
            const previewBox = document.getElementById('preview-box');
            const previewImage = document.getElementById('preview-image');
            const previewLoader = document.getElementById('preview-loader');
            const triggers = document.querySelectorAll('.preview-trigger');

            triggers.forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => {
                    // Prende l'url dell'immagine dal data-attribute
                    const imgUrl = trigger.getAttribute('data-img');
                    
                    // Mostra la box e lo spinner
                    previewBox.style.display = 'block';
                    previewImage.style.display = 'none';
                    previewLoader.style.display = 'block';
                    
                    // Carica l'immagine
                    previewImage.src = imgUrl;
                    previewImage.onload = () => {
                        previewLoader.style.display = 'none';
                        previewImage.style.display = 'block';
                    };
                });

                trigger.addEventListener('mousemove', (e) => {
                    // Fa seguire la finestra al mouse
                    // Controlla se esce fuori dallo schermo a destra
                    let posX = e.clientX + 15;
                    let posY = e.clientY + 15;

                    if (posX + 300 > window.innerWidth) {
                        posX = e.clientX - 315; // Sposta a sinistra del mouse
                    }
                    if (posY + 225 > window.innerHeight) {
                        posY = e.clientY - 240; // Sposta sopra al mouse
                    }

                    previewBox.style.left = posX + 'px';
                    previewBox.style.top = posY + 'px';
                });

                trigger.addEventListener('mouseleave', () => {
                    // Nasconde l'anteprima
                    previewBox.style.display = 'none';
                    previewImage.src = ''; 
                });
            });
        }
    </script>
</body>
</html>
